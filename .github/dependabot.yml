version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/grit-hs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Keep routine patch noise to a single PR; majors still come through
      # individually so they get read properly.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
